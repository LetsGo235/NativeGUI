plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = neo_version
    runs {
        client { client() }
    }
    mods {
        nativegui { sourceSet sourceSets.main }
    }
}

tasks.named('processResources', ProcessResources) {
    inputs.property 'mod_version', mod_version
    filesMatching('META-INF/neoforge.mods.toml') {
        expand(mod_version: mod_version)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

// These smoke tests are ordinary Java main() programs with assertions rather than
// JUnit/TestNG classes. Gradle 9's default Test task otherwise fails when it
// detects test source files but discovers no framework-managed test methods.
// The smoke tests still execute as JavaExec tasks below; check depends on both.
tasks.named('test', Test) {
    failOnNoDiscoveredTests = false
}

// The standalone Gson-backed JSON smoke tests run outside Minecraft.
// Minecraft supplies Gson at game runtime, but JavaExec's test classpath
// does not automatically inherit the Minecraft launcher libraries.
// Keep this dependency strictly test-only: it does NOT ship in the mod JAR.
repositories {
    mavenCentral()
}

dependencies {
    testRuntimeOnly 'com.google.code.gson:gson:2.10.1'
}

// Uses no extra runtime libraries, Fabric API, Kotlin or Connector.

// Standalone regression tests run in addition to the normal Gradle build.
tasks.register('verifyLegacyRules', JavaExec) {
    group = 'verification'
    description = 'Verify published resource-pack format interoperability.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.isaac.nativegui.core.LegacyRulesSmokeTest'
    enableAssertions = true
}
tasks.named('check') {
    dependsOn tasks.named('verifyLegacyRules')
}

tasks.register('verifyJsonRules', JavaExec) {
    group = 'verification'
    description = 'Verify supported OptiGUI 3 JSON rules and fail-closed matchers.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.isaac.nativegui.core.JsonGuiSmokeTest'
    enableAssertions = true
}
tasks.named('check') {
    dependsOn tasks.named('verifyJsonRules')
}
